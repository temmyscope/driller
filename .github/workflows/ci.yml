# CI gates (P4-8b): typecheck, lint and `npm test` on every push to main and
# every pull request, on Node 22 (the `engines` floor) and the `.nvmrc`
# version (the founder's local major).
#
# Each gate is its own job (the `gate` matrix axis), so a failure names its
# gate, and `fail-fast: false` keeps one gate's failure from cancelling the
# others. The gates run exactly the local commands; anything CI needs goes
# into the npm script, never only in here.
#
# Network is used at install only (`npm ci`: the CBM runtime, npm packages).
# `npm test` refuses network itself (P4-8a's guard). No secrets are used; a
# fork PR runs with the read-only token.
#
# Actions are pinned to full commit SHAs (resolved from the tags named in the
# comments with `git ls-remote` on 2026-10-06).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, lint, test]
        node: ['22.x', '.nvmrc']
    env:
      # No gate launches Electron. Electron 43 no longer downloads at install
      # (only on first launch), so this is a belt-and-braces no-op today.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # node-llama-cpp 3.20.0's postinstall exits at once when this is set
      # (`defaultSkipDownload` in its dist/config.js). No gate loads a model.
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node != '.nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == '.nvmrc' && '.nvmrc' || '' }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci)
        run: |
          node --version
          npm --version
          time npm ci

      - name: npm run ${{ matrix.gate }}
        shell: bash # -eo pipefail: the gate's exit code survives the tee
        env:
          GATE: ${{ matrix.gate }}
        run: npm run "$GATE" 2>&1 | tee "$RUNNER_TEMP/npm-$GATE-output.txt"

      - name: Upload the npm test output
        if: failure() && matrix.gate == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-test-output-node-${{ matrix.node }}
          path: ${{ runner.temp }}/npm-test-output.txt
          retention-days: 7
          if-no-files-found: ignore
