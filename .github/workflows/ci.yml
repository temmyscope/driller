# CI gates (P4-8b): typecheck, lint and `npm test` on every push to main and
# every pull request, on Node 22 (the `engines` floor, 22.22.2+) and the
# `.nvmrc` version (24 LTS).
#
# Each gate is its own job (the `gate` matrix axis), so a failure names its
# gate, and `fail-fast: false` keeps one gate's failure from cancelling the
# others. The gates run exactly the local commands; anything CI needs goes
# into the npm script, never only in here.
#
# Network is used at install only (`npm ci`: the CBM runtime, npm packages).
# `npm test` refuses network itself (P4-8a's guard). No secrets are used; a
# fork PR runs with the read-only token.
#
# Actions are pinned to full commit SHAs (resolved from the tags named in the
# comments with `git ls-remote` on 2026-10-06).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # P4-8i: the macOS `e2e` job runs only on a manual trigger (founder
  # decision 2026-10-06). A dispatch also runs the gates.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is in the key so a manual e2e dispatch and a push to the same
  # ref never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The `.nvmrc` leg is named by the Node it resolves to (24 LTS).
    name: ${{ matrix.gate }} (Node ${{ matrix.node == '.nvmrc' && '24 (.nvmrc)' || matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, lint, test]
        node: ['22.x', '.nvmrc']
    env:
      # No gate launches Electron. Electron 43 no longer downloads at install
      # (only on first launch), so this is a belt-and-braces no-op today.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # node-llama-cpp 3.20.0's postinstall exits at once when this is set
      # (`defaultSkipDownload` in its dist/config.js). No gate loads a model.
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node != '.nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == '.nvmrc' && '.nvmrc' || '' }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci)
        run: |
          node --version
          npm --version
          time npm ci

      - name: npm run ${{ matrix.gate }}
        shell: bash # -eo pipefail: the gate's exit code survives the tee
        env:
          GATE: ${{ matrix.gate }}
        run: npm run "$GATE" 2>&1 | tee "$RUNNER_TEMP/npm-$GATE-output.txt"

      - name: Upload the npm test output
        if: failure() && matrix.gate == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-test-output-node-${{ matrix.node }}
          path: ${{ runner.temp }}/npm-test-output.txt
          retention-days: 7
          if-no-files-found: ignore

  # P4-8i: `npm run e2e -- --report` drives the real dev app (electron-forge
  # start) over CDP on the founder's platform, on the `.nvmrc` Node (24 LTS).
  # Manual trigger only; never on push or pull_request (Ask First). No secrets: the run selects the cloud
  # backend with no key, and the harness refuses non-loopback network inside
  # the app (the local-model download is expected to be refused).
  e2e:
    name: e2e (macOS, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      # node-llama-cpp's postinstall exits at once; no journey loads a model.
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24 (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci; installs the CBM runtime)
        run: |
          node --version
          time npm ci
          test -x node_modules/codebase-memory-mcp/bin/codebase-memory-mcp

      # Electron 43 downloads its binary on first launch, which inside the
      # e2e run would hit the harness's network guard, so fetch it here.
      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: npm run e2e -- --report
        shell: bash # -eo pipefail: the run's exit code survives the tee
        run: npm run e2e -- --report 2>&1 | tee "$RUNNER_TEMP/npm-e2e-output.txt"

      - name: Upload the e2e artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            ${{ runner.temp }}/npm-e2e-output.txt
          retention-days: 7
          if-no-files-found: ignore
